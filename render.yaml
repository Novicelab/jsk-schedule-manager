services:
  # ========== Frontend (Render Static Site) ==========
  #
  # 배포 구성 이력 (2026-09-23 정정)
  # -------------------------------------------------------------------
  # 이 파일은 이전까지 `type: web_service` + `startCommand: npm run server`
  # 로 선언돼 있었으나, 실제 배포는 Render Static Site 로 동작한다.
  #
  # 근거 (프로덕션 응답 헤더 확인):
  #   - `x-powered-by: Express` 없음
  #   - server.js 에서 설정한 헤더(sw.js 의 Cache-Control: no-cache)가 미반영
  #   - Render CDN 헤더(`s-maxage`, `rndr-id`)만 존재
  # 반면 envVars/buildCommand 는 정상 적용된다 (VITE_* 가 번들에 주입됨).
  #
  # 즉 런타임 타입은 대시보드 설정이 우선이고, 빌드 설정은 이 파일이 적용된다.
  # 선언과 실제가 어긋나 오해를 유발하므로 실제 동작에 맞춰 정정한다.
  #
  # server.js / 루트 package.json 은 프로덕션에서 실행되지 않으며
  # 로컬에서 빌드 결과물을 확인할 때만 사용한다.
  # -------------------------------------------------------------------
  - type: web
    name: jsk-schedule-frontend
    runtime: static
    branch: main
    autoDeployTrigger: commit

    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist

    # SPA 라우팅: 알 수 없는 경로는 index.html 로 (react-router 처리)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Service Worker 는 매 요청 재검증해야 새 버전이 즉시 반영된다.
      # 이 설정이 없으면 사용자가 옛 sw.js 를 계속 쓰게 된다.
      - path: /sw.js
        name: Cache-Control
        value: no-cache

    # Environment variables
    envVars:
      - key: VITE_KAKAO_CLIENT_ID
        value: "240f33554023d9ab4957b2d638fb0d71"
      - key: VITE_KAKAO_REDIRECT_URI
        value: https://jsk-schedule-frontend.onrender.com/auth/callback
      - key: VITE_SUPABASE_URL
        value: https://qphhpfolrbsyiyoevaoe.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwaGhwZm9scmJzeWl5b2V2YW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0OTA4NTQsImV4cCI6MjA4NzA2Njg1NH0.8nMygPUObvGiPFJZE02mvl4J7_lqILF3bOkj69KLzqs"
      # 웹 푸시 VAPID 공개키 (브라우저에 전달되는 공개 값이므로 노출 무방)
      # 발송 권한은 Supabase Secrets의 VAPID_PRIVATE_KEY 가 가진다.
      # 키 교체 시 frontend/public/sw.js 의 VAPID_PUBLIC_KEY 상수도 함께 수정할 것
      - key: VITE_VAPID_PUBLIC_KEY
        value: "BI2aB7WJtRI2yWSx9FbP4shaHynkx2K1NPloRF9bUXOBbw7JD1PceeBF_zlTx6eEIFOTU7hAX53wYaAtHviHOfY"
